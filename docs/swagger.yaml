basePath: /api
definitions:
  account.CreateAccountRequest:
    properties:
      currency:
        example: USD
        type: string
      icon:
        example: icon
        type: string
      initialBalance:
        example: 0
        type: number
      isExcludedFromCount:
        example: false
        type: boolean
      isHidden:
        example: false
        type: boolean
      isNegativeBalanceEnabled:
        example: false
        type: boolean
      name:
        example: My Account
        type: string
    required:
    - currency
    - icon
    - initialBalance
    - isExcludedFromCount
    - isHidden
    - isNegativeBalanceEnabled
    - name
    type: object
  account.CreateAccountResponse:
    properties:
      account:
        $ref: '#/definitions/dto.Account'
    required:
    - account
    type: object
  account.GetAccountByIDResponse:
    properties:
      account:
        $ref: '#/definitions/dto.Account'
    required:
    - account
    type: object
  account.GetAccountsByUserIDResponse:
    properties:
      accounts:
        items:
          $ref: '#/definitions/dto.Account'
        type: array
    required:
    - accounts
    type: object
  account.GetBalanceByAccountIdResponse:
    properties:
      accountID:
        type: string
      balance:
        type: number
      currency:
        $ref: '#/definitions/dto.Currency'
    required:
    - accountID
    - balance
    - currency
    type: object
  account.UpdateAccountRequest:
    properties:
      icon:
        example: icon
        type: string
      isExcludedFromCount:
        example: false
        type: boolean
      isHidden:
        example: false
        type: boolean
      isNegativeBalanceEnabled:
        example: false
        type: boolean
      name:
        example: My Account
        type: string
    required:
    - icon
    - isExcludedFromCount
    - isHidden
    - isNegativeBalanceEnabled
    - name
    type: object
  account.UpdateAccountResponse:
    properties:
      account:
        $ref: '#/definitions/dto.Account'
    required:
    - account
    type: object
  auth.LoginRequest:
    properties:
      email:
        example: john@example.com
        type: string
      password:
        example: "12345678"
        type: string
    required:
    - email
    - password
    type: object
  auth.LoginResponse:
    properties:
      user:
        $ref: '#/definitions/dto.User'
    required:
    - user
    type: object
  auth.LogoutResponse:
    properties:
