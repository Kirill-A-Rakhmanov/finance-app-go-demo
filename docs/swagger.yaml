host: localhost:3100
info:
  contact: {}
  description: Finance application API
  title: Finance App API
  version: "1.0"
paths:
  /account:
    post:
      consumes:
      - application/json
      description: Create new account for current user
      parameters:
      - description: Create account request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.CreateAccountResponse'
      summary: Create account
      tags:
      - account
  /account/{accountID}:
    get:
      consumes:
      - application/json
      description: Get account by id if it belongs to the current user
      parameters:
      - description: Account ID
        format: uuid
        in: path
        name: accountID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.GetAccountByIDResponse'
      summary: Get account by id
      tags:
      - account
    patch:
      consumes:
      - application/json
      description: Update the account for current user
      parameters:
      - description: Account ID
        format: uuid
        in: path
        name: accountID
        required: true
        type: string
      - description: Update account request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/account.UpdateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.UpdateAccountResponse'
      summary: Update account
      tags:
      - account
  /account/{accountID}/balance:
    get:
      consumes:
      - application/json
      description: Get balance by account id
      parameters:
      - description: Account ID
        format: uuid
        in: path
        name: accountID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.GetBalanceByAccountIdResponse'
      summary: Get balance
      tags:
      - account
  /account/list:
    get:
      consumes:
      - application/json
      description: Get current user accounts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.GetAccountsByUserIDResponse'
      summary: Get accounts
      tags:
      - account
  /auth/login:
    post:
      consumes:
      - application/json
      description: Login existing user. Unknown email and wrong password both return
        401 invalid credentials. After 5 failed attempts for an email within 15 minutes
        the endpoint answers 429 with a Retry-After header.
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
      summary: Login user
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout existing user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LogoutResponse'
      summary: Logout user
      tags:
      - auth
  /auth/recovery:
    post:
      consumes:
      - application/json
      description: Sends a password recovery code to the user's email. The response
        is the same whether or not the account exists, and a repeated request for
        the same email within 2 minutes sends nothing.
      parameters:
      - description: Recovery request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RecoveryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.RecoveryResponse'
      summary: Request password recovery
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Refresh token pair and set cookies
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.RefreshTokensResponse'
      summary: Refresh tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Starts a registration and emails a confirmation link
      parameters:
      - description: Register request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.RegisterResponse'
      summary: Register user
      tags:
      - auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Resets the password using a recovery code
      parameters:
      - description: Reset password request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ResetPasswordResponse'
