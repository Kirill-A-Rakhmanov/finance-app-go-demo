      firstName:
        example: John
        type: string
      lastName:
        example: Doe
        type: string
      password:
        example: "12345678"
        type: string
    required:
    - email
    - firstName
    - lastName
    - password
    type: object
  auth.RegisterResponse:
    properties:
      message:
        type: string
    required:
    - message
    type: object
  auth.ResetPasswordRequest:
    properties:
      code:
        example: 6f6b6b6c-1a2b-4c3d-9e8f-123456789abc
